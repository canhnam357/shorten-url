variables:
  MAVEN_CLI_OPTS: "--no-transfer-progress -B"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE

stages:
  - build
  - docker-build
  - deploy

# ── Cache template ────────────────────────────────────────────────────
.maven-cache:
  cache:
    key: "$CI_PROJECT_ID-maven"
    paths:
      - .m2/repository/

# ── Stage 1: Maven build ─────────────────────────────────────────────
build:
  extends: .maven-cache
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  tags:
    - docker
  script:
    - mvn clean package -DskipTests $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - target/
    expire_in: 1 hour

# ── Stage 3: Docker build & push ─────────────────────────────────────
docker-build:
  stage: docker-build
  image: docker:27
  tags:
    - docker
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  dependencies:
    - build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA $DOCKER_IMAGE:latest
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE:latest
  after_script:
    - docker logout
  only:
    - main

# ── Stage 4: Deploy lên VM ───────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  dependencies: []
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $VM_USER@$VM_HOST "
        echo '$CI_REGISTRY_PASSWORD' | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin &&
        docker pull $CI_REGISTRY_IMAGE:latest &&
        docker stop shorten-url || true &&
        docker rm shorten-url || true &&
        docker run -d --name shorten-url --restart unless-stopped \
          --network ubuntu_default \
          --env-file /home/ubuntu/.env \
          -p 8080:8080 $CI_REGISTRY_IMAGE:latest &&
        docker logout
      "
  only:
    - main