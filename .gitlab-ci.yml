variables:
  MAVEN_CLI_OPTS: "--no-transfer-progress -B"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE

stages:
  - build
  - docker-build
  - deploy

# ── Cache template ────────────────────────────────────────────────────
.maven-cache:
  cache:
    key: "$CI_PROJECT_ID-maven"
    paths:
      - .m2/repository/

# ── Stage 1: Maven build ─────────────────────────────────────────────
build:
  extends: .maven-cache
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  tags:
    - docker
  script:
    - mvn clean package -DskipTests $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - target/
    expire_in: 1 hour

# ── Stage 3: Docker build & push ─────────────────────────────────────
docker-build:
  stage: docker-build
  image: docker:27
  tags:
    - docker
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  dependencies:
    - build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA $DOCKER_IMAGE:latest
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE:latest
  after_script:
    - docker logout
  only:
    - main

# ── Stage 4: Deploy lên VM ───────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  script:
    - |
      ssh $VM_USER@$VM_HOST "
        # 1. Đi vào thư mục chứa docker-compose.yml và .env
        cd ~/shorten_url &&
      
        # 2. Login để có quyền pull image mới
        echo '$CI_REGISTRY_PASSWORD' | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin &&
      
        # 3. Pull duy nhất image của App (không pull lại mysql/redis nếu không cần)
        docker compose pull url-app &&
      
        # 4. Up lại hệ thống. 
        # Docker Compose sẽ tự động nhận biết chỉ có App thay đổi và restart mình nó.
        # Nó sẽ tự dùng file .env tại thư mục này.
        docker compose up -d --remove-orphans &&
      
        # 5. Dọn dẹp image cũ
        docker image prune -f &&
      
        docker logout
      "
  only:
    - main